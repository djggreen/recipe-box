<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Recipe Box</title>
<meta name="description" content="Our family's favorite recipes, all in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='38' rx='5' fill='%232d6a48'/%3E%3Crect x='12' y='8' width='40' height='14' rx='3' fill='%23e3a62a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Family Recipe Box</h1>
      <p>Our favorites, all in one place.</p>
    </div>
    <div class="top-actions">
      <a class="btn primary" id="requestBtn" href="#" target="_blank" rel="noopener" hidden>Request a recipe</a>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="roulette" id="roulette" aria-label="Recipe roulette">
    <div class="slot">
      <div class="eyebrow" id="slotEyebrow">What's for dinner?</div>
      <div class="slot-window"><div class="slot-text idle" id="slotText" aria-live="polite">Spin to let the box decide</div></div>
      <div class="slot-meta" id="slotMeta"></div>
    </div>
    <button class="spin-btn" id="spinBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      Roulette
    </button>
  </section>

  <section class="toolbar" aria-label="Find a recipe">
    <input class="search" id="search" type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes or ingredients">
    <div class="filter-bar">
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="chips">
        <span id="filterLabel">Filter by tag</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="chip clear-tag" id="clearTag" type="button" hidden>Clear</button>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" hidden></div>
  </section>

  <section id="list" aria-live="polite">
    <div class="empty">
      <h2>Opening the recipe box…</h2>
      <p>The recipes will appear here as index cards.</p>
    </div>
  </section>
</div>

<div class="overlay" id="viewOv" hidden><article class="sheet" id="viewSheet" role="dialog" aria-modal="true" aria-label="Recipe"></article></div>

<script src="app.js"></script>
</body>
</html>
